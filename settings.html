<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LIRR Settings</title>

<meta name="color-scheme" content="light">
<style>
  html, body {
    background: #ffffff !important;
    color: #000000 !important;
    forced-color-adjust: none;
    font-family: sans-serif;
    padding: 20px;
  }
  a.button {
    display: block;
    padding: 16px;
    background: #007aff;
    color: white;
    text-align: center;
    border-radius: 6px;
    font-size: 18px;
    text-decoration: none;
    margin-top: 20px;
  }
</style>
</head>

<body>

<h2>LIRR Trip Planner Settings</h2>
<p>Pebble cannot open file pickers inside the Settings window.</p>
<p>Tap below to open the GTFS uploader in your phone’s browser.</p>

<a class="button" href="https://pkarnofsky.github.io/lirr/upload.html">
  Open GTFS Uploader
</a>

</body>
</html>
<script>
document.getElementById("open").addEventListener("click", function() {
  // Close the Pebble WebView and signal the JS companion
  document.location = "pebblejs://close#open-uploader";
});
</script>

</body>
</html>
