<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LIRR GTFS Uploader</title>
<style>
  body {
    font-family: sans-serif;
    padding: 20px;
    background: #ffffff;
    color: #000000;
  }
  #status {
    margin-top: 20px;
    font-weight: bold;
  }
</style>
</head>
<body>

<h2>LIRR GTFS Upload</h2>
<p>Select <strong>gtfslirr.zip</strong> to load the full LIRR schedule into your Pebble app.</p>

<input type="file" id="file" accept=".zip">
<div id="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
<script>
const statusEl = document.getElementById("status");

function setStatus(msg) {
  statusEl.textContent = msg;
  console.log(msg);
}

document.getElementById("file").addEventListener("change", async function(evt) {
  const file = evt.target.files[0];
  if (!file) {
    setStatus("No file selected.");
    return;
  }

  setStatus("Reading ZIP…");

  try {
    const zip = await JSZip.loadAsync(file);

    const stopsTxt     = await zip.file("stops.txt").async("string");
    const stopTimesTxt = await zip.file("stop_times.txt").async("string");
    const tripsTxt     = await zip.file("trips.txt").async("string");

    setStatus("Parsing CSV…");

    function parseCSV(text) {
      const lines = text.trim().split("\n");
      const headers = lines[0].split(",");
      return lines.slice(1).map(line => {
        const cols = line.split(",");
        const obj = {};
        headers.forEach((h, i) => obj[h] = cols[i]);
        return obj;
      });
    }

    const stops = parseCSV(stopsTxt);
    const stopTimes = parseCSV(stopTimesTxt);
    const trips = parseCSV(tripsTxt);

    setStatus("Building compact JSON…");

    const stopsOut = {};
    stops.forEach(s => {
      if (!stopsOut[s.stop_name]) stopsOut[s.stop_name] = [];
      stopsOut[s.stop_name].push(s.stop_id);
    });

    function timeToEpoch(hms) {
      const [h, m, s] = hms.split(":").map(Number);
      const now = new Date();
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, s);
      return Math.floor(d.getTime() / 1000);
    }

    const stopTimesOut = stopTimes.map(st => ({
      trip: st.trip_id,
      stop: st.stop_id,
      seq: parseInt(st.stop_sequence, 10),
      dep: timeToEpoch(st.departure_time),
      display: st.departure_time
    }));

    const tripsOut = {};
    trips.forEach(t => {
      tripsOut[t.trip_id] = {
        route: t.route_id,
        dir: t.direction_id
      };
    });

    const payload = {
      stops: stopsOut,
      stop_times: stopTimesOut,
      trips: tripsOut
    };

    setStatus("Sending data back to Pebble…");

    const encoded = encodeURIComponent(JSON.stringify(payload));
    document.location = "pebblejs://close#" + encoded;

  } catch (err) {
    console.error(err);
    setStatus("Error processing GTFS ZIP: " + err);
  }
});
</script>

</body>
</html>
