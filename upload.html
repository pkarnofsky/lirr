<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LIRR 5-Station GTFS → JSON (Android Safe)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 700px; }
    textarea { width: 100%; height: 200px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>LIRR 5-Station GTFS → JSON (Android Safe)</h1>

  <p>Use the filtered stop_times file from Page A.</p>

  <label>stops.txt: <input type="file" id="stops"></label><br>
  <label>trips.txt: <input type="file" id="trips"></label><br>
  <label>calendar.txt (optional): <input type="file" id="cal"></label><br>
  <label>calendar_dates.txt (optional): <input type="file" id="caldates"></label><br>
  <label>stop_times_filtered.json: <input type="file" id="filtered"></label><br>

  <label>
    Gist raw URL:
    <input type="text" id="gistUrl" style="width:100%;">
  </label>

  <button id="processBtn">Generate JSON</button>

  <h2>Output JSON</h2>
  <textarea id="output"></textarea>

  <script>
    const TARGET = new Set(["349","237","55","102","59"]);
    const ORDER = ["349","237","55","102","59"];

    document.getElementById("processBtn").onclick = async () => {
      const stops = await readText("stops");
      const trips = await readText("trips");
      const cal = await readText("cal", true);
      const caldates = await readText("caldates", true);
      const filtered = await readJSON("filtered");

      const stopsArr = parseCSV(stops);
      const tripsArr = parseCSV(trips);
      const calArr = cal ? parseCSV(cal) : null;
      const caldatesArr = caldates ? parseCSV(caldates) : null;

      const now = new Date();
      const today = ymd(now);
      const tomorrow = ymd(new Date(now.getTime()+86400000));
      const serviceDates = new Set([today, tomorrow]);

      const active = computeActive(serviceDates, calArr, caldatesArr);
      const { filteredTrips, tripIdSet } = filterTrips(tripsArr, active);

      const stopIdToName = {};
      stopsArr.forEach(s => {
        if (TARGET.has(s.stop_id)) stopIdToName[s.stop_id] = s.stop_name;
      });

      const stopsObj = {};
      ORDER.forEach(id => {
        if (stopIdToName[id]) stopsObj[stopIdToName[id]] = [id];
      });

      const tripsObj = {};
      filteredTrips.forEach(t => {
        tripsObj[t.trip_id] = { route: t.route_id, service_id: t.service_id };
      });

      const stopTimesArr = filtered
        .filter(st => tripIdSet.has(st.trip))
        .map(st => ({
          trip: st.trip,
          stop: st.stop,
          seq: st.seq,
          dep: toSec(st.dep),
          disp: st.dep
        }));

      const out = {
        generated_at: new Date().toISOString(),
        service_dates: Array.from(serviceDates),
        stops: stopsObj,
        trips: tripsObj,
        stop_times: stopTimesArr
      };

      document.getElementById("output").value = JSON.stringify(out, null, 2);
    };

    function readText(id, optional) {
      const f = document.getElementById(id).files[0];
      if (!f) return optional ? Promise.resolve(null) : Promise.reject("Missing "+id);
      return f.text();
    }
    function readJSON(id) {
      const f = document.getElementById(id).files[0];
      if (!f) throw "Missing filtered stop_times";
      return f.text().then(JSON.parse);
    }

    function parseCSV(text) {
      const lines = text.trim().split("\n");
      const header = lines[0].split(",");
      return lines.slice(1).map(l => {
        const cols = l.split(",");
        const o = {};
        header.forEach((h,i)=>o[h]=cols[i]);
        return o;
      });
    }

    function ymd(d) {
      return d.getFullYear().toString() +
        String(d.getMonth()+1).padStart(2,"0") +
        String(d.getDate()).padStart(2,"0");
    }

    function computeActive(serviceDates, cal, caldates) {
      const active = new Set();
      if (cal) {
        cal.forEach(row => {
          serviceDates.forEach(date => {
            if (date >= row.start_date && date <= row.end_date) {
              const dow = new Date(date.slice(0,4)+"-"+date.slice(4,6)+"-"+date.slice(6,8)).getDay();
              const map = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
              if (row[map[dow]] === "1") active.add(row.service_id);
            }
          });
        });
      }
      if (caldates) {
        caldates.forEach(row => {
          if (!serviceDates.has(row.date)) return;
          if (row.exception_type === "1") active.add(row.service_id);
          if (row.exception_type === "2") active.delete(row.service_id);
        });
      }
      return active;
    }

    function filterTrips(trips, active) {
      const out = [];
      const set = new Set();
      trips.forEach(t => {
        if (active.has(t.service_id)) {
          out.push(t);
          set.add(t.trip_id);
        }
      });
      return { filteredTrips: out, tripIdSet: set };
    }

    function toSec(t) {
      if (!t) return 0;
      const [h,m,s] = t.split(":").map(Number);
      return h*3600 + m*60 + s;
    }
  </script>
</body>
</html>
