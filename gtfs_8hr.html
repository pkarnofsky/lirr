<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LIRR GTFS → JSON (Next 8 Hours)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; }
    textarea { width: 100%; height: 250px; font-family: monospace; }
    label { display: block; margin-top: 12px; }
  </style>
</head>
<body>

<h1>LIRR GTFS → JSON (Next 8 Hours)</h1>

<p>Upload the full GTFS ZIP. This page extracts only trips departing in the next 8 hours.</p>

<label>
  GTFS ZIP:
  <input type="file" id="zipInput" accept=".zip">
</label>

<label>
  Gist raw URL for gtfs.json:
  <input type="text" id="gistUrl" style="width:100%;">
</label>

<button id="processBtn">Process GTFS</button>

<h2>Output JSON</h2>
<textarea id="output"></textarea>

<script>
/* ------------------------------
   Utility: read ZIP entries
--------------------------------*/
async function unzip(file) {
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  return zip;
}

/* ------------------------------
   Utility: parse CSV
--------------------------------*/
function parseCSV(text) {
  const lines = text.trim().split("\n");
  const header = lines[0].split(",");
  return lines.slice(1).map(line => {
    const cols = line.split(",");
    const o = {};
    header.forEach((h,i)=>o[h]=cols[i]);
    return o;
  });
}

/* ------------------------------
   Convert HH:MM:SS → epoch seconds today
--------------------------------*/
function toEpochSeconds(t) {
  if (!t) return null;
  const [h,m,s] = t.split(":").map(Number);
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, s);
  return d.getTime() / 1000;
}

/* ------------------------------
   MAIN
--------------------------------*/
document.getElementById("processBtn").onclick = async () => {
  const zipFile = document.getElementById("zipInput").files[0];
  if (!zipFile) {
    alert("Select GTFS ZIP first");
    return;
  }

  const zip = await unzip(zipFile);

  // Load small files
  const stopsTxt = await zip.file("stops.txt").async("string");
  const tripsTxt = await zip.file("trips.txt").async("string");
  const calTxt = await zip.file("calendar.txt").async("string").catch(()=>null);
  const calDatesTxt = await zip.file("calendar_dates.txt").async("string").catch(()=>null);

  const stops = parseCSV(stopsTxt);
  const trips = parseCSV(tripsTxt);
  const cal = calTxt ? parseCSV(calTxt) : null;
  const calDates = calDatesTxt ? parseCSV(calDatesTxt) : null;

  // Build service_id → active today
  const now = new Date();
  const today = now.getFullYear().toString() +
                String(now.getMonth()+1).padStart(2,"0") +
                String(now.getDate()).padStart(2,"0");

  const active = new Set();

  if (cal) {
    cal.forEach(row => {
      if (today >= row.start_date && today <= row.end_date) {
        const dow = now.getDay();
        const map = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
        if (row[map[dow]] === "1") active.add(row.service_id);
      }
    });
  }

  if (calDates) {
    calDates.forEach(row => {
      if (row.date !== today) return;
      if (row.exception_type === "1") active.add(row.service_id);
      if (row.exception_type === "2") active.delete(row.service_id);
    });
  }

  // Filter trips by active service_id
  const activeTrips = new Set();
  trips.forEach(t => {
    if (active.has(t.service_id)) activeTrips.add(t.trip_id);
  });

  // STREAM stop_times.txt (Android-safe)
  const stFile = zip.file("stop_times.txt");
  if (!stFile) {
    alert("stop_times.txt missing");
    return;
  }

  const stStream = stFile.internalStream("string");
  const reader = stStream.getReader();
  let leftover = "";
  let header = null;

  const stopTimes = [];

  const nowEpoch = now.getTime() / 1000;
  const cutoffEpoch = nowEpoch + 8 * 3600;

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;

    const text = leftover + value;
    const lines = text.split("\n");
    leftover = lines.pop();

    for (const line of lines) {
      if (!header) {
        header = line.split(",");
        continue;
      }
      const cols = line.split(",");
      const obj = {};
      header.forEach((h,i)=>obj[h]=cols[i]);

      if (!activeTrips.has(obj.trip_id)) continue;

      const depEpoch = toEpochSeconds(obj.departure_time);
      if (depEpoch === null) continue;

      if (depEpoch >= nowEpoch && depEpoch <= cutoffEpoch) {
        stopTimes.push({
          trip: obj.trip_id,
          stop: obj.stop_id,
          seq: parseInt(obj.stop_sequence,10)||0,
          dep: depEpoch,
          disp: obj.departure_time
        });
      }
    }
  }

  // Keep only trips that appear in stopTimes
  const finalTrips = {};
  const usedTrips = new Set(stopTimes.map(st => st.trip));

  trips.forEach(t => {
    if (usedTrips.has(t.trip_id)) {
      finalTrips[t.trip_id] = {
        route: t.route_id,
        service_id: t.service_id
      };
    }
  });

  // Build stops object for only used stop_ids
  const usedStops = new Set(stopTimes.map(st => st.stop));
  const finalStops = {};

  stops.forEach(s => {
    if (usedStops.has(s.stop_id)) {
      finalStops[s.stop_name] = [s.stop_id];
    }
  });

  const out = {
    generated_at: new Date().toISOString(),
    window_hours: 8,
    stops: finalStops,
    trips: finalTrips,
    stop_times: stopTimes
  };

  document.getElementById("output").value = JSON.stringify(out, null, 2);
};

/* ------------------------------
   JSZip loader
--------------------------------*/
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

</body>
</html>
